# 入口 nginx（工单 0013）：前端 SPA + /p/ 公开静态直出 + /api 反代。
#
# 路径约定：数据卷在 backend 与 web 两个容器里都挂到 /app/data
# （backend/app/public_links.py 维护的符号链接是绝对目标，必须同路径才有效）。
# /p/{slug} → /app/data/storage/p/{slug}（符号链接 → 项目目录），由 nginx 直出、不经后端；
# 符号链接缺失/异常时降级反代后端（@public_fallback），后端 /p/ 路由自带发布校验与 CSP。
#
# /preview/ 即 /api/projects/{id}/preview/...，走 /api 反代，鉴权由后端按登录 Cookie 完成。

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- 前端 SPA 静态 ---
    root /usr/share/nginx/html;
    index index.html;

    # --- 已发布应用的公开链接：nginx 直出（验收项：不经后端） ---
    location /p/ {
        root /app/data/storage;
        # CSP sandbox：用户生成内容必须获得不透明源，防窃取主站登录态；
        # 仅对直出响应生效（兜底响应由后端携带同款头，不叠加）
        add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-popups allow-modals" always;
        try_files $uri $uri/index.html @public_fallback;
    }

    # 直出未命中（链接丢失/未建立）时降级反代后端，与 public_links 的降级承诺一致；
    # 404（不存在或已下架的 slug）仍由后端给出，语义不变。
    location @public_fallback {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- API 反代：含登录鉴权、生成（SSE 流式）与 /preview/ 鉴权代理 ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE：关闭缓冲，生成过程逐块下发；长生成给足读写超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- SPA 路由回退 ---
    location / {
        try_files $uri /index.html;
    }
}
