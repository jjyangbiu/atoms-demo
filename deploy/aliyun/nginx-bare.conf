# 免 Docker 裸机部署的 nginx 站点配置（工单 0014，演示推荐路径）。
#
# 与容器化方案的差别：/p/ 不直出静态，而是反代给后端——
# 后端自带发布校验与 CSP sandbox（backend/app/routers/publish.py），
# 无需维护符号链接，演示场景最省心。
#
# 安装位置：/etc/nginx/sites-available/atoms（再软链到 sites-enabled）。

server {
    listen 80 default_server;
    server_name _;

    charset utf-8;
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端 SPA 静态产物（npm run build 输出）
    root /opt/atoms/frontend/dist;
    index index.html;

    # 已发布应用的公开链接：反代后端，发布校验与 CSP sandbox 由后端完成
    location /p/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 反代：含登录鉴权、生成（SSE 流式）与 /preview/ 鉴权代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE：关闭缓冲，生成过程逐块下发；长生成给足读写超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA 路由回退
    location / {
        try_files $uri /index.html;
    }
}
